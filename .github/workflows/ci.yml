name: ml-pipeline-ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Run the pipeline (ingest, validate, train, evaluate, gate)
        run: python run_pipeline.py --train data/train.csv --eval data/eval.csv
      # CD note: a deploy step would run here, gated on this job passing and on the
      # pipeline promoting the challenger to champion.
